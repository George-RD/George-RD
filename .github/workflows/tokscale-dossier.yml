name: Update profile activity graphics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
  pull_request:
    paths:
      - "README.md"
      - "assets/tokscale-dossier.svg"
      - "assets/tokscale-model-momentum.svg"
      - "assets/tokscale-dossier.json"
      - "assets/contribution-lens.svg"
      - "assets/contribution-lens-mobile.svg"
      - "assets/contribution-lens.json"
      - "scripts/render-tokscale-dossier.mjs"
      - "scripts/render-tokscale-momentum.mjs"
      - "scripts/render-contribution-lens.mjs"
      - "scripts/refine-contribution-lens.mjs"
      - "tests/render-contribution-lens.test.mjs"
      - "tests/render-tokscale-momentum.test.mjs"
      - "tests/refine-contribution-lens.test.mjs"
      - ".github/workflows/tokscale-dossier.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity-graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate renderer syntax
        run: |
          node --check scripts/render-tokscale-dossier.mjs
          node --check scripts/render-tokscale-momentum.mjs
          node --check scripts/render-contribution-lens.mjs
          node --check scripts/refine-contribution-lens.mjs

      - name: Test profile graphics
        run: node --test tests/*.test.mjs

      - name: Render profile activity graphics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/render-tokscale-dossier.mjs \
            --username George-RD \
            --out assets/tokscale-dossier.svg \
            --trends-out assets/tokscale-model-momentum.svg \
            --meta assets/tokscale-dossier.json

          node scripts/render-tokscale-momentum.mjs \
            --username George-RD \
            --out assets/tokscale-model-momentum.svg \
            --meta assets/tokscale-dossier.json

          node scripts/render-contribution-lens.mjs \
            --username George-RD \
            --out assets/contribution-lens.svg \
            --mobile-out assets/contribution-lens-mobile.svg \
            --meta assets/contribution-lens.json

          node scripts/refine-contribution-lens.mjs \
            --in assets/contribution-lens.svg \
            --mobile-in assets/contribution-lens-mobile.svg \
            --meta assets/contribution-lens.json \
            --out assets/contribution-lens.svg \
            --mobile-out assets/contribution-lens-mobile.svg

      - name: Check generated files exist
        run: |
          test -s assets/tokscale-dossier.svg
          test -s assets/tokscale-model-momentum.svg
          test -s assets/tokscale-dossier.json
          test -s assets/contribution-lens.svg
          test -s assets/contribution-lens-mobile.svg
          test -s assets/contribution-lens.json

      - name: Rasterize profile graphics for visual review
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p visual-check
          rsvg-convert -w 1200 assets/contribution-lens.svg > visual-check/contribution-lens-desktop.png
          rsvg-convert -w 720 assets/contribution-lens-mobile.svg > visual-check/contribution-lens-mobile.png
          rsvg-convert -w 1200 assets/tokscale-model-momentum.svg > visual-check/tokscale-model-momentum.png
          test -s visual-check/contribution-lens-desktop.png
          test -s visual-check/contribution-lens-mobile.png
          test -s visual-check/tokscale-model-momentum.png

      - name: Upload profile graphics visual check
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: profile-graphics-visual-check
          path: visual-check/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated graphics
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- \
            assets/tokscale-dossier.svg \
            assets/tokscale-model-momentum.svg \
            assets/tokscale-dossier.json \
            assets/contribution-lens.svg \
            assets/contribution-lens-mobile.svg \
            assets/contribution-lens.json; then
            echo "Profile activity graphics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/tokscale-dossier.svg \
            assets/tokscale-model-momentum.svg \
            assets/tokscale-dossier.json \
            assets/contribution-lens.svg \
            assets/contribution-lens-mobile.svg \
            assets/contribution-lens.json
          git commit -m "Refresh profile activity graphics"
          git push
