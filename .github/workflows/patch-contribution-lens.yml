name: Apply contribution lens visual review fixes

on:
  push:
    branches:
      - agent/contribution-lens-visual-check

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply reviewed visual refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/render-contribution-lens.mjs")
          source = path.read_text()
          replacements = [
              (
                  '    openspine: "OPEN",\n    mag: "MAG",',
                  '    openspine: "OPEN",\n    hologlyph: "HOLO",\n    "cli-anything-meerk40t": "MEER",\n    mag: "MAG",',
              ),
              (
                  '      repoLabel: repoShortName(repo || (familyTotal > 0 ? "TOOLS" : "")),',
                  '      repoLabel: future ? "" : repoShortName(repo || (familyTotal > 0 ? "TOOLS" : "")),',
              ),
              ('    y: lensY + 42,', '    y: lensY + 48,'),
              (
                  '<text class="label" x="${lensX + 18}" y="${lensY + 24}">LATEST 4 WEEKS</text>',
                  '<text class="label" x="${lensX + 18}" y="${lensY + 20}">LATEST 4 WEEKS</text>',
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f"Expected source fragment not found: {old}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          node --check scripts/render-contribution-lens.mjs
          node --test tests/render-contribution-lens.test.mjs

      - name: Commit reviewed refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/render-contribution-lens.mjs
          git commit -m "Refine contribution lens after visual review"
          git push
